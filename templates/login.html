<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <title>Login</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

<div class="login-container">

    <h1>CyberSec Login</h1>
    <!-- Flash Messages -->

{% with messages = get_flashed_messages() %}

    {% if messages %}

        {% for message in messages %}

            <div class="alert-box">
                {{ message }}
            </div>

        {% endfor %}

    {% endif %}

{% endwith %}

    <form method="POST">

        <input type="text"
               name="username"
               placeholder="Username"
               required>

        <input type="password"
               name="password"
               placeholder="Password"
               required>

        <button type="submit">Login</button>

    </form>

</div>

</body>
</html>
